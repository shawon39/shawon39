<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-label="A command palette searching for Shakhawat Hossain">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t { fill: #e6edf3; font-size: 15px; font-weight: 600; }
    .s { fill: #8b949e; font-size: 12.5px; }
    .r { opacity: 0; animation: in .45s ease-out forwards; }
    .r1 { animation-delay: 1.9s; } .r2 { animation-delay: 2.1s; } .r3 { animation-delay: 2.3s; }
    .r4 { animation-delay: 2.5s; } .r5 { animation-delay: 2.7s; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .hl { opacity: 0; animation: show .3s 3.2s forwards, walk 10s 3.2s ease-in-out infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes walk {
      0%, 16% { transform: translateY(0); }
      20%, 36% { transform: translateY(52px); }
      40%, 56% { transform: translateY(104px); }
      60%, 76% { transform: translateY(156px); }
      80%, 96% { transform: translateY(208px); }
      100% { transform: translateY(0); }
    }
  </style>
  <defs>
    <clipPath id="type"><rect x="104" y="36" height="36" width="0">
      <animate attributeName="width" from="0" to="215" begin="0.4s" dur="1.3s" fill="freeze"/>
    </rect></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="800" height="400" rx="16" fill="#0d1117" stroke="url(#glow)" stroke-opacity=".6"/>

  <!-- search row -->
  <rect x="44" y="40" width="44" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="66" y="58" text-anchor="middle" class="mono" fill="#8b949e" font-size="13">⌘K</text>
  <text x="106" y="62" class="mono" fill="#e6edf3" font-size="20" clip-path="url(#type)">shakhawat hossain</text>
  <rect class="cursor" x="106" y="44" width="2" height="24" fill="#58a6ff">
    <animate attributeName="x" from="106" to="321" begin="0.4s" dur="1.3s" fill="freeze"/>
  </rect>
  <line x1="20" y1="86" x2="820" y2="86" stroke="#21262d"/>

  <!-- moving highlight -->
  <rect class="hl" x="32" y="96" width="776" height="48" rx="10" fill="#1f6feb" fill-opacity=".16" stroke="#1f6feb" stroke-opacity=".5"/>

  <!-- results -->
  <g class="r r1">
    <rect x="44" y="104" width="32" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="126" text-anchor="middle" font-size="16">👋</text>
    <text x="92" y="117" class="t">Shakhawat Hossain</text>
    <text x="92" y="135" class="s">Senior Salesforce Engineer · Bangladesh</text>
    <rect x="716" y="108" width="76" height="24" rx="12" fill="#a371f7" fill-opacity=".15"/>
    <text x="754" y="124" text-anchor="middle" fill="#d2a8ff" font-size="12">Person</text>
  </g>
  <g class="r r2">
    <rect x="44" y="156" width="32" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="178" text-anchor="middle" font-size="16">⚡</text>
    <text x="92" y="169" class="t">navigator-for-salesforce</text>
    <text x="92" y="187" class="s">One command palette for all of Salesforce — like this one</text>
    <rect x="716" y="160" width="76" height="24" rx="12" fill="#3fb950" fill-opacity=".15"/>
    <text x="754" y="176" text-anchor="middle" fill="#56d364" font-size="12">Extension</text>
  </g>
  <g class="r r3">
    <rect x="44" y="208" width="32" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="230" text-anchor="middle" font-size="16">🪵</text>
    <text x="92" y="221" class="t">smart-debug-log</text>
    <text x="92" y="239" class="s">Salesforce debug logs, finally readable</text>
    <rect x="716" y="212" width="76" height="24" rx="12" fill="#3fb950" fill-opacity=".15"/>
    <text x="754" y="228" text-anchor="middle" fill="#56d364" font-size="12">Extension</text>
  </g>
  <g class="r r4">
    <rect x="44" y="260" width="32" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="282" text-anchor="middle" font-size="16">🎬</text>
    <text x="92" y="273" class="t">screencast-studio</text>
    <text x="92" y="291" class="s">Raw screen recording in, finished video out</text>
    <rect x="716" y="264" width="76" height="24" rx="12" fill="#f0883e" fill-opacity=".15"/>
    <text x="754" y="280" text-anchor="middle" fill="#ffa657" font-size="12">App</text>
  </g>
  <g class="r r5">
    <rect x="44" y="312" width="32" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="334" text-anchor="middle" font-size="16">📚</text>
    <text x="92" y="325" class="t">Guides that make hard things easy</text>
    <text x="92" y="343" class="s">System design · Postman · Claude · Salesforce integration</text>
    <rect x="716" y="316" width="76" height="24" rx="12" fill="#58a6ff" fill-opacity=".15"/>
    <text x="754" y="332" text-anchor="middle" fill="#79c0ff" font-size="12">Guides</text>
  </g>

  <!-- footer -->
  <line x1="20" y1="368" x2="820" y2="368" stroke="#21262d"/>
  <text x="44" y="399" class="mono" fill="#6e7681" font-size="12">↑↓ navigate   ↵ open   esc close</text>
  <text x="796" y="399" text-anchor="end" class="mono" fill="#6e7681" font-size="12">coder · introvert · inquisitive</text>
</svg>
