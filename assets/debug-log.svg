    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .n { fill: #484f58; } .ts { fill: #7d8590; } .dim { fill: #484f58; }
