<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img" aria-label="A Salesforce debug log introducing Shakhawat Hossain, Senior Salesforce Engineer from Bangladesh">
  <style>
